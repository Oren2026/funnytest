name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: evolution-planner-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: evolution-planner-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: evolution-planner-macos-intel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: evolution-planner-windows.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          cargo build --release --features llm --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/planner_cli${{ matrix.target == 'x86_64-pc-windows-msvc' && '.exe' || '' }} ${{ matrix.artifact }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
