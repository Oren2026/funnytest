<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待辦事項</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0f1a;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(120, 80, 255, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(80, 200, 255, 0.1) 0%, transparent 50%);
      color: #e0e0f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    .app {
      width: 100%;
      max-width: 520px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .theme-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #a78bfa;
      box-shadow: 0 0 12px #a78bfa;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .input-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: #a78bfa;
      box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.15);
    }

    input[type="text"]::placeholder { color: rgba(255, 255, 255, 0.3); }

    .btn-add {
      padding: 12px 22px;
      background: linear-gradient(135deg, #a78bfa, #8b5cf6);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: opacity 0.2s, transform 0.15s;
      white-space: nowrap;
    }

    .btn-add:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-add:active { transform: translateY(0); }

    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .filter-btn {
      padding: 7px 16px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.45);
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .filter-btn:hover { border-color: rgba(167, 139, 250, 0.4); color: rgba(255, 255, 255, 0.7); }

    .filter-btn.active {
      background: linear-gradient(135deg, #a78bfa, #8b5cf6);
      color: #fff;
      border-color: transparent;
    }

    .stats {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.3);
      margin-bottom: 12px;
      display: flex;
      gap: 16px;
    }

    .stats span { display: flex; align-items: center; gap: 4px; }
    .stats .active-count { color: #a78bfa; }
    .stats .done-count { color: #34d399; }

    .todo-list { display: flex; flex-direction: column; gap: 8px; }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      transition: all 0.2s;
      animation: slideIn 0.2s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .todo-item:hover { background: rgba(255, 255, 255, 0.07); }

    .todo-item.done { opacity: 0.45; }
    .todo-item.done .todo-text { text-decoration: line-through; color: rgba(255, 255, 255, 0.4); }

    .todo-item.removing { animation: fadeOut 0.2s ease-out forwards; }

    @keyframes fadeOut {
      to { opacity: 0; transform: translateX(20px); }
    }

    .checkbox {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid rgba(167, 139, 250, 0.5);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .checkbox.checked {
      background: linear-gradient(135deg, #a78bfa, #8b5cf6);
      border-color: transparent;
    }

    .checkbox.checked::after {
      content: '✓';
      color: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .todo-text {
      flex: 1;
      font-size: 15px;
      color: #e0e0f0;
      word-break: break-word;
    }

    .btn-delete {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.2);
      cursor: pointer;
      font-size: 18px;
      padding: 4px 6px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
      flex-shrink: 0;
    }

    .btn-delete:hover { color: #f87171; background: rgba(248, 113, 113, 0.1); }

    .empty-state {
      text-align: center;
      padding: 48px 0;
      color: rgba(255, 255, 255, 0.2);
      font-size: 14px;
    }

    .empty-state .icon { font-size: 40px; margin-bottom: 12px; opacity: 0.3; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>待辦事項</h1>
      <div class="theme-dot"></div>
    </header>

    <div class="input-card">
      <div class="input-row">
        <input type="text" id="todoInput" placeholder="新增待辦事項..." onkeydown="if(event.key==='Enter')addTodo()">
        <button class="btn-add" onclick="addTodo()">新增</button>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">全部</button>
      <button class="filter-btn" data-filter="active" onclick="setFilter('active')">進行中</button>
      <button class="filter-btn" data-filter="done" onclick="setFilter('done')">已完成</button>
    </div>

    <div class="stats" id="stats"></div>
    <div class="todo-list" id="todoList"></div>
  </div>

  <script>
    let todos = JSON.parse(localStorage.getItem('todos_v2') || '[]');
    let filter = 'all';

    function save() {
      localStorage.setItem('todos_v2', JSON.stringify(todos));
    }

    function render() {
      const list = document.getElementById('todoList');
      const stats = document.getElementById('stats');
      const active = todos.filter(t => !t.done).length;
      const done = todos.filter(t => t.done).length;

      stats.innerHTML = `
        <span class="active-count">● ${active} 進行中</span>
        <span class="done-count">● ${done} 已完成</span>
      `;

      const filtered = filter === 'all' ? todos :
        filter === 'done' ? todos.filter(t => t.done) : todos.filter(t => !t.done);

      if (filtered.length === 0) {
        const msg = filter === 'all'
          ? '<div class="empty-state"><div class="icon">📝</div>還沒有待辦事項<br>新增一筆試試吧</div>'
          : filter === 'done'
            ? '<div class="empty-state"><div class="icon">✅</div>目前沒有已完成的項目</div>'
            : '<div class="empty-state"><div class="icon">🔥</div>太棒了，全部完成！</div>';
        list.innerHTML = msg;
      } else {
        list.innerHTML = filtered.map((t, i) => {
          const realIdx = todos.indexOf(t);
          return `
            <div class="todo-item ${t.done ? 'done' : ''}">
              <div class="checkbox ${t.done ? 'checked' : ''}" onclick="toggle(${realIdx})"></div>
              <span class="todo-text">${escHtml(t.text)}</span>
              <button class="btn-delete" onclick="del(${realIdx})">✕</button>
            </div>`;
        }).join('');
      }

      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.filter === filter);
      });
    }

    function escHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();
      if (!text) return;
      todos.unshift({ text, done: false, id: Date.now() });
      input.value = '';
      save();
      render();
    }

    function toggle(idx) {
      todos[idx].done = !todos[idx].done;
      save();
      render();
    }

    function del(idx) {
      const items = document.querySelectorAll('.todo-item');
      if (items[idx]) {
        items[idx].classList.add('removing');
        setTimeout(() => {
          todos.splice(idx, 1);
          save();
          render();
        }, 200);
      }
    }

    function setFilter(f) {
      filter = f;
      render();
    }

    render();
  </script>
</body>
</html>
